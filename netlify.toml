# kabu-ship is a native Android app (Kotlin + Jetpack Compose, built with Gradle).
# The Netlify build installs JDK 21, Gradle and the Android SDK, builds the debug
# APK, and publishes it with a small download page.
[build]
  command = "bash netlify/build-apk.sh"
  publish = "build/netlify"

[[headers]]
  for = "/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"kabu-ship.apk\""
